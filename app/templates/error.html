{# 403 / 404 / 500 공용 오류 화면 #}
{% extends "base.html" %}
{% block title %}{{ title }} · {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 text-center py-5">
    <div class="display-1 fw-bold text-muted">{{ code }}</div>
    <h1 class="h4 mt-2">{{ title }}</h1>
    <p class="text-muted">{{ message }}</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary mt-2">
      <i class="bi bi-house me-1"></i>처음 화면으로
    </a>
  </div>
</div>
{% endblock %}
